name: Django CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    # تشغيل قاعدة بيانات مؤقتة MySQL
    services:
      mysql:
        image: mysql:8  # صورة رسمية من Docker Hub
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306

    # إعداد المتغيرات البيئية
    env:
      DATABASE_NAME: test_db
      DATABASE_USER: root
      DATABASE_PASSWORD: root
      DATABASE_HOST: 127.0.0.1

    steps:
      # سحب الكود من GitHub
      - name: Checkout repo
        uses: actions/checkout@v3

      # إعداد بايثون
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # تثبيت dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-django coverage mysqlclient

      # تشغيل migrate على قاعدة البيانات المؤقتة
      - name: Run migrations
        run: |
          python manage.py migrate

      # التحقق من جودة الكود (flake8)
      - name: Run Flake8
        run: |
          flake8 . --max-line-length=120
          
      # تشغيل الاختبارات مع تسجيل التغطية
      - name: Run Tests
        run: |
          coverage run -m pytest
          coverage report
          coverage xml

      # رفع تقرير التغطية كـ artifact
      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage.xml
